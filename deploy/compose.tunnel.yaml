# Optional overlay for an EXISTING remotely managed Cloudflare Tunnel.
# Its public-hostname service must point to http://api:8000.
# Supply the existing tunnel token through a protected environment file.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.3.0@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Existing Cloudflare tunnel token is required}
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
